name: Build and Upload Apps to S3

on:
  push:
    branches: [main, ci]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Studio app
        run: pnpm --filter studio run build

      - name: Zip dist folder
        run: |
          cd apps/studio/out
          zip -r ../../../studio-ui-dist.zip .

      - name: List build artifacts
        run: |
          ls -la
          ls -la apps/studio/

      - name: Read version from package.json
        id: pkg
        run: |
          echo "VERSION=$(jq -r .version apps/studio/package.json)" >> $GITHUB_OUTPUT

      - name: Upload zip to S3 (versioned)
        run: |
          aws s3 cp studio-ui-dist.zip s3://${{ secrets.S3_BUCKET_NAME }}/surfpool-studio-ui/v${{ steps.pkg.outputs.VERSION }}.zip --acl public-read
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Upload zip to S3 (latest)
        run: |
          aws s3 cp studio-ui-dist.zip s3://${{ secrets.S3_BUCKET_NAME }}/surfpool-studio-ui/latest.zip --acl public-read
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Build Surfnet app
        run: pnpm --filter surfnet run build

      - name: Zip Surfnet dist folder
        run: |
          cd apps/surfnet/out
          zip -r ../../../surfnet-dist.zip .

      - name: Read Surfnet version from package.json
        id: surfnet_pkg
        run: |
          echo "VERSION=$(jq -r .version apps/surfnet/package.json)" >> $GITHUB_OUTPUT

      - name: Upload Surfnet zip to S3 (versioned)
        run: |
          aws s3 cp surfnet-dist.zip s3://${{ secrets.S3_BUCKET_NAME }}/surfnet-ui/v${{ steps.surfnet_pkg.outputs.VERSION }}.zip --acl public-read
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Upload Surfnet zip to S3 (latest)
        run: |
          aws s3 cp surfnet-dist.zip s3://${{ secrets.S3_BUCKET_NAME }}/surfnet-ui/latest.zip --acl public-read
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Sync Surfnet UI to S3
        run: |
          aws s3 sync apps/surfnet/out s3://${{ secrets.S3_BUCKET_NAME }}/surfnet-ui/ --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-2

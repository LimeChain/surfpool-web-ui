name: Build and Upload Apps to S3

on:
  push:
    branches: [main, ci]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - name: studio
            filter: studio
            s3_path: surfpool-studio-ui
          - name: surfnet
            filter: surfnet
            s3_path: surfnet-ui
            sync_to_s3: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.app.name }} app
        run: pnpm --filter ${{ matrix.app.filter }} run build

      - name: Zip dist folder
        run: |
          cd apps/${{ matrix.app.name }}/out
          zip -r ../../../${{ matrix.app.name }}-dist.zip .

      - name: Read version from package.json
        id: pkg
        run: |
          echo "VERSION=$(jq -r .version apps/${{ matrix.app.name }}/package.json)" >> $GITHUB_OUTPUT

      - name: Upload zip to S3 (versioned)
        run: |
          aws s3 cp ${{ matrix.app.name }}-dist.zip s3://${{ secrets.S3_BUCKET_NAME }}/${{ matrix.app.s3_path }}/v${{ steps.pkg.outputs.VERSION }}.zip --acl public-read
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Upload zip to S3 (latest)
        run: |
          aws s3 cp ${{ matrix.app.name }}-dist.zip s3://${{ secrets.S3_BUCKET_NAME }}/${{ matrix.app.s3_path }}/latest.zip --acl public-read
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Sync to S3 (if enabled)
        if: matrix.app.sync_to_s3 == true
        run: |
          aws s3 sync apps/${{ matrix.app.name }}/out s3://${{ secrets.S3_BUCKET_NAME }}/${{ matrix.app.s3_path }}/ --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-2

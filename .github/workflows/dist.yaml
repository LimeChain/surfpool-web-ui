name: Build and Upload Apps to S3

on:
  push:
    branches: [main, ci]
  workflow_dispatch:

jobs:
  build-studio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build studio app
        run: pnpm --filter studio run build

      - name: Zip dist folder
        run: |
          cd apps/studio/out
          zip -r ../../../studio-dist.zip .

      - name: Read version from package.json
        id: pkg
        run: |
          echo "VERSION=$(jq -r .version apps/studio/package.json)" >> $GITHUB_OUTPUT

      - name: Upload zip to S3 (versioned)
        run: |
          aws s3 cp studio-dist.zip s3://${{ secrets.S3_BUCKET_NAME }}/surfpool-studio-ui/v${{ steps.pkg.outputs.VERSION }}.zip --acl public-read
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Upload zip to S3 (latest)
        run: |
          aws s3 cp studio-dist.zip s3://${{ secrets.S3_BUCKET_NAME }}/surfpool-studio-ui/latest.zip --acl public-read
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

  build-surfnet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build surfnet app
        run: pnpm --filter surfnet run build

      - name: Read version from package.json
        id: pkg
        run: |
          echo "VERSION=$(jq -r .version apps/surfnet/package.json)" >> $GITHUB_OUTPUT

      - name: Zip dist folder
        run: |
          cd apps/surfnet/out
          zip -r ../../../surfnet-dist.zip .

      - name: Upload zip to S3 (versioned)
        run: |
          aws s3 cp surfnet-dist.zip s3://${{ secrets.S3_BUCKET_NAME }}/surfnet-ui/v${{ steps.pkg.outputs.VERSION }}.zip --acl public-read
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Upload zip to S3 (latest)
        run: |
          aws s3 cp surfnet-dist.zip s3://${{ secrets.S3_BUCKET_NAME }}/surfnet-ui/latest.zip --acl public-read
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      # Sync to root S3 folder (current behavior - keeps site working)
      - name: Sync to S3 root folder
        run: |
          aws s3 sync apps/surfnet/out s3://${{ secrets.S3_BUCKET_NAME }}/surfnet-ui/ --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-2

      # Deploy to per-network S3 folders with customized OG meta tags
      # (for when Lambda is updated to support subdomain routing)
      - name: Deploy to per-network S3 folders
        run: |
          # List of networks (subdirectories in public/ that have config.json)
          NETWORKS=$(ls -d apps/surfnet/public/*/ | xargs -I {} basename {} | grep -v og)

          for NETWORK in $NETWORKS; do
            echo "Processing network: $NETWORK"

            # Create a copy of the build for this network
            cp -r apps/surfnet/out "out-$NETWORK"

            # Read config.json to get network metadata
            if [ -f "apps/surfnet/public/$NETWORK/config.json" ]; then
              NETWORK_NAME=$(jq -r '.network_name' "apps/surfnet/public/$NETWORK/config.json")
              NETWORK_DESC=$(jq -r '.network_description' "apps/surfnet/public/$NETWORK/config.json")

              # Format title: replace " - " with " | " for cleaner display
              NETWORK_TITLE=$(echo "$NETWORK_NAME" | sed 's/ - / | /g')

              # Escape special characters for perl regex
              NETWORK_TITLE_ESC=$(echo "$NETWORK_TITLE" | sed 's/[&/\]/\\&/g')
              NETWORK_NAME_ESC=$(echo "$NETWORK_NAME" | sed 's/[&/\]/\\&/g')
              NETWORK_DESC_ESC=$(echo "$NETWORK_DESC" | sed 's/[&/\]/\\&/g')

              # Update index.html with network-specific metadata
              # Use perl for safer in-place regex replacement
              # Note: Using # as delimiter since title may contain | character

              # Title
              perl -i -pe 's#<title>[^<]+</title>#<title>'"$NETWORK_TITLE_ESC"'</title>#g' "out-$NETWORK/index.html"

              # OG title
              perl -i -pe 's#property="og:title" content="[^"]+\"#property="og:title" content="'"$NETWORK_NAME_ESC"'"#g' "out-$NETWORK/index.html"

              # OG description
              perl -i -pe 's#property="og:description" content="[^"]+\"#property="og:description" content="'"$NETWORK_DESC_ESC"'"#g' "out-$NETWORK/index.html"

              # OG image
              perl -i -pe 's#property="og:image" content="[^"]+\"#property="og:image" content="https://'"$NETWORK"'.surfnet.dev/og/'"$NETWORK"'.png"#g' "out-$NETWORK/index.html"

              # Twitter title
              perl -i -pe 's#name="twitter:title" content="[^"]+\"#name="twitter:title" content="'"$NETWORK_NAME_ESC"'"#g' "out-$NETWORK/index.html"

              # Twitter description
              perl -i -pe 's#name="twitter:description" content="[^"]+\"#name="twitter:description" content="'"$NETWORK_DESC_ESC"'"#g' "out-$NETWORK/index.html"

              # Twitter image
              perl -i -pe 's#name="twitter:image" content="[^"]+\"#name="twitter:image" content="https://'"$NETWORK"'.surfnet.dev/og/'"$NETWORK"'.png"#g' "out-$NETWORK/index.html"

              # Meta description
              perl -i -pe 's#name="description" content="[^"]+\"#name="description" content="'"$NETWORK_DESC_ESC"'"#g' "out-$NETWORK/index.html"

              echo "Updated index.html for $NETWORK with: $NETWORK_NAME"
            fi

            # Sync to S3 folder for this network
            aws s3 sync "out-$NETWORK" "s3://${{ secrets.S3_BUCKET_NAME }}/surfnet-ui/$NETWORK/" --delete

            # Cleanup
            rm -rf "out-$NETWORK"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-2
